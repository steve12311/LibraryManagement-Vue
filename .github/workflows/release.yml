name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

      - name: Archive dist
        run: tar -czf release.tar.gz dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes

            See [commits](${{ github.event.repository.html_url }}/compare/${{ github.event.before }}...${{ github.event.after }}) for details.
          files: release.tar.gz
